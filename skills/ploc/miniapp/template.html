<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Required: name and icon shown in PLOC. The icon is a name from icons.md, without ".svg". -->
<meta name="ploc:name" content="My mini app">
<meta name="ploc:icon" content="puzzle">
<title>My mini app</title>
<style>
    :root {
        color-scheme: light dark;
        --bg: #f5f0eb;
        --card: #fff;
        --text: #2c2c2c;
        --muted: #777;
        --accent: #7b2d42;
        --line: #eee;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #1c1a1b;
            --card: #2a2627;
            --text: #f1ecea;
            --muted: #a39b98;
            --accent: #d0657f;
            --line: #3a3536;
        }
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
        font-family: -apple-system, system-ui, Arial, sans-serif;
        margin: 0;
        padding: 20px;
        padding-bottom: calc(20px + env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--text);
    }

    h1 { color: var(--accent); margin: 0 0 4px; font-size: 1.4rem; }
    .subtitle { margin: 0 0 20px; color: var(--muted); font-size: .9rem; }

    .card {
        background: var(--card);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, .08);
    }

    button {
        font: inherit;
        border: 0;
        border-radius: 8px;
        padding: 12px 16px;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
    }

    button:disabled { opacity: .5; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: 10px 0; border-bottom: 1px solid var(--line); }
    li:last-child { border-bottom: 0; }
    li button { all: unset; display: block; width: 100%; cursor: pointer; }
    .empty { text-align: center; color: var(--muted); }
</style>
</head>
<body>
    <h1>My mini app</h1>
    <p class="subtitle" id="summary">Loading…</p>

    <div class="card">
        <ul id="list"></ul>
    </div>

<script>
// All the page code lives in an IIFE: its names cannot collide with the SDK globals (Order, Wine, Period...).
(() => {
    const $ = id => document.getElementById(id);

    async function init() {
        // PLOC injects `sdk`. Outside PLOC (a normal browser) it does not exist: show a message instead of failing.
        if (typeof sdk === "undefined" || sdk.isMock) {
            $("summary").textContent = "Open this page from the PLOC app to see your cellar.";
            return;
        }

        const info = await sdk.cellar.getInfo();
        $("summary").textContent = info.empty
            ? "Your cellar is empty."
            : `${info.counts.bottles} bottles · ${info.counts.wines} wines`;

        const wines = (await sdk.cellar.wine.getAll()).filter(w => w.bottles > 0).sortBy("name").toArray();
        $("list").innerHTML = "";

        if (!wines.length) {
            $("list").innerHTML = '<li class="empty">No wine</li>';
            return;
        }

        for (const wine of wines.slice(0, 50)) {
            const li = document.createElement("li");
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = wine.name;                   // textContent, never innerHTML, for user data
            button.addEventListener("click", () => sdk.ui.openWine({ id: wine.id }));
            li.append(button);
            $("list").append(li);
        }
    }

    init().catch(error => {
        $("summary").textContent = "Something went wrong: " + error.message;
    });
})();
</script>
</body>
</html>
